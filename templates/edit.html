<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh Sửa Món Ăn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

            .form-group label {
                display: block;
                font-weight: bold;
                margin-bottom: 5px;
            }

            .form-group input {
                width: 96%;
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }

        .btn-save {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-size: 15px;
        }

        .btn-cancel {
            background: #6c757d;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 15px;
            margin-left: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>✏️ Cập Nhật Thông Tin Món Ăn</h2>
        <form action="/admin/cap-nhat-mon/{{ mon.id }}" method="POST">
            <div class="form-group">
                <label>Tên Món Ăn:</label>
                <input type="text" name="ten" value="{{ mon.ten }}" required>
            </div>
            <div class="form-group">
                <label>Giá Bán (VNĐ):</label>
                <input type="number" name="gia" value="{{ mon.gia }}" required>
            </div>
            <div class="form-group">
                <label>Đường Dẫn Hình Ảnh (URL):</label>
                <input type="text" name="hinh" value="{{ mon.hinh }}" required>
            </div>
            <button type="submit" class="btn-save">💾 Lưu Thay Đổi</button>
            <a href="/admin" class="btn-cancel">Hủy Bỏ</a>
        </form>
    </div>
</body>
</html>
