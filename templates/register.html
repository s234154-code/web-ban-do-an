<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản Khách Hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl max-w-md w-full">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-amber-400 flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i> Đăng Ký Tài Khoản
            </h2>
            <p class="text-slate-400 text-xs mt-1">Tạo tài khoản dành cho Khách Hàng</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/50 text-red-400 text-xs p-3 rounded-lg mb-4 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/register" class="space-y-4">
            <div>
                <label class="block text-slate-300 text-xs font-semibold mb-1">TÊN ĐĂNG NHẬP</label>
                <input type="text" name="username" required placeholder="Nhập username..."
                       class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white text-sm outline-none focus:border-amber-500 transition">
            </div>

            <div>
                <label class="block text-slate-300 text-xs font-semibold mb-1">MẬT KHẨU</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white text-sm outline-none focus:border-amber-500 transition">
            </div>

            <div>
                <label class="block text-slate-300 text-xs font-semibold mb-1">XÁC NHẬN MẬT KHẨU</label>
                <input type="password" name="confirm_password" required placeholder="••••••••"
                       class="w-full bg-slate-700/50 border border-slate-600 rounded-lg px-4 py-2.5 text-white text-sm outline-none focus:border-amber-500 transition">
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2.5 rounded-lg text-sm transition mt-2">
                ĐĂNG KÝ NGAY
            </button>
        </form>

        <div class="text-center mt-6 pt-4 border-t border-slate-700/60 text-xs text-slate-400">
            Đã có tài khoản?
            <a href="/login" class="text-amber-400 hover:underline font-bold">Đăng nhập tại đây</a>
        </div>
    </div>

</body>
</html>
