<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập Quản Trị</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 320px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

            .form-group label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
            }

            .form-group input {
                width: 93%;
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }

        .btn {
            width: 100%;
            background: #007bff;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

            .btn:hover {
                background: #0056b3;
            }

        .msg {
            color: red;
            text-align: center;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

            .link a {
                color: #007bff;
                text-decoration: none;
            }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔒 Đăng Nhập Admin</h2>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="msg">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <form action="/login" method="POST">
            <div class="form-group">
                <label>Tài khoản:</label>
                <input type="text" name="tai_khoan" required placeholder="Nhập tên tài khoản">
            </div>
            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" name="mat_khau" required placeholder="Nhập mật khẩu">
            </div>
            <button type="submit" class="btn">Đăng Nhập</button>
        </form>
        <div class="link">
            Chưa có tài khoản? <a href="/register">Đăng ký ngay</a><br><br>
            <a href="/">⬅ Quay về trang chủ</a>
        </div>
    </div>
</body>
</html>
