<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl max-w-md w-full border border-gray-700">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-yellow-400 flex items-center justify-center gap-2">
                🔑 Đăng Nhập Hệ Thống
            </h1>
            <p class="text-gray-400 text-xs mt-1">Dành cho Khách Hàng, Nhân Viên & Quản Lý</p>
        </div>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500 text-red-400 text-xs p-3 rounded-lg mb-4 text-center">
            {{ error }}
        </div>
        {% endif %}

        <!-- Thêm autocomplete="off" vào form -->
        <form action="/login" method="POST" class="space-y-4" autocomplete="off">
            <div>
                <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Tên đăng nhập</label>
                <!-- Thêm autocomplete="off" -->
                <input type="text" name="username" required placeholder="Nhập username..." autocomplete="off" class="w-full bg-gray-700 text-white p-3 rounded-xl border border-gray-600 focus:outline-none focus:border-yellow-400 text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Mật khẩu</label>
                <!-- Thêm autocomplete="new-password" để chặn trình duyệt tự điền pass cũ -->
                <input type="password" name="password" required placeholder="••••••••" autocomplete="new-password" class="w-full bg-gray-700 text-white p-3 rounded-xl border border-gray-600 focus:outline-none focus:border-yellow-400 text-sm">
            </div>

            <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-extrabold py-3 rounded-xl transition shadow-lg text-sm uppercase">
                Đăng Nhập
            </button>
        </form>

        <div class="mt-6 text-center border-t border-gray-700 pt-4">
            <p class="text-gray-400 text-xs">
                Chưa có tài khoản?
                <a href="/register" class="text-yellow-400 hover:underline font-bold">Tạo tài khoản Khách Hàng</a>
            </p>
        </div>
    </div>

</body>
</html>
