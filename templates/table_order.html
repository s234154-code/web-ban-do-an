<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Món Tại Bàn - Ăn Vặt Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 min-h-screen p-4">

    <!-- Thanh Điều Hướng & Quay Về -->
    <div class="max-w-3xl mx-auto mb-4 flex justify-between items-center gap-2">
        <a href="/" class="bg-white hover:bg-gray-100 text-orange-600 font-bold px-4 py-2 rounded-xl text-sm transition shadow border border-orange-200 flex items-center gap-1">
            ⬅️ Quay Về Đặt Online
        </a>
        <div class="flex items-center gap-2">
            <a href="/kitchen" class="bg-gray-800 hover:bg-gray-900 text-yellow-300 font-semibold px-3 py-2 rounded-xl text-xs transition shadow">
                👨‍🍳 Bếp
            </a>
            <a href="/admin" class="bg-gray-800 hover:bg-gray-900 text-white font-semibold px-3 py-2 rounded-xl text-xs transition shadow">
                📊 Quản Lý
            </a>
        </div>
    </div>

    <!-- Header Chọn Số Bàn -->
    <div class="max-w-3xl mx-auto bg-orange-600 text-white rounded-2xl p-5 shadow-lg mb-6 text-center">
        <h1 class="text-2xl font-bold">🪑 ĐẶT MÓN TẠI BÀN</h1>
        <p class="text-sm opacity-90 mt-1">Chọn món ăn ưa thích - Bếp sẽ phục vụ ngay tại bàn của bạn!</p>

        <div class="mt-4 inline-flex items-center bg-white text-orange-800 font-bold px-4 py-2 rounded-xl text-lg shadow">
            📍 Vị trí: Bàn số
            <input type="number" id="tableInput" value="{{ table_id }}" min="1" max="50" class="w-16 ml-2 p-1 border-2 border-orange-500 rounded text-center text-orange-900 focus:outline-none" onchange="updateTableNumber(this.value)">
        </div>
    </div>

    <!-- Danh Sách Món -->
    <div class="max-w-3xl mx-auto grid grid-cols-1 sm:grid-cols-2 gap-4">
        {% for food in foods %}
        <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-orange-100 flex flex-col justify-between">
            <img src="{{ food[4] or 'https://via.placeholder.com/300' }}" class="w-full h-40 object-cover">

            <div class="p-4 flex-1 flex flex-col justify-between">
                <div>
                    <span class="text-xs font-bold text-orange-600 bg-orange-100 px-2.5 py-0.5 rounded-full">{{ food[2] }}</span>
                    <h3 class="font-bold text-lg text-gray-800 mt-1">{{ food[1] }}</h3>
                    <p class="text-orange-600 font-extrabold text-lg mt-1">{{ "{:,.0f}".format(food[3]) }} VNĐ</p>
                </div>

                <!-- Form Gửi Đơn Tại Bàn -->
                <form action="/order-table" method="POST" class="mt-4 pt-3 border-t flex items-center gap-2">
                    <input type="hidden" name="table_number" class="table-num-hidden" value="{{ table_id }}">
                    <input type="hidden" name="food_id" value="{{ food[0] }}">

                    <div class="flex items-center border rounded-lg bg-gray-50">
                        <span class="text-xs text-gray-500 px-2">SL:</span>
                        <input type="number" name="quantity" value="1" min="1" max="20" class="w-12 p-1 text-center font-bold text-gray-800 bg-transparent focus:outline-none">
                    </div>

                    <button type="submit" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 rounded-lg text-sm transition shadow">
                        🛒 Gọi Món
                    </button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>

    <script>
        function updateTableNumber(val) {
            const hiddenInputs = document.querySelectorAll('.table-num-hidden');
            hiddenInputs.forEach(input => input.value = val);
        }
    </script>
</body>
</html>
